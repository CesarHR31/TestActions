name: Compile and Package scala solution

on: [workflow_dispatch]
#on:
#  push:
#    branches: [ "main" ]
#  pull_request:
#    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    
    - name: Checkout
      uses: actions/checkout@v7
    
    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'sbt'

    - name: Set up sbt
      uses: sbt/setup-sbt@v1
      with: 
        sbt-runner-version: 1.9.8

    - name: Compile and Package
      working-directory: ./testSpark/GithubActions
      run: sbt clean compile package

    - name: Upload JAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: test-jar
        path: ./testSpark/GithubActions/target/scala-*/*.jar
