name: Scala CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up sbt
      uses: sbt/setup-sbt@v1

    - name: Set up Docker
      uses: docker/setup-docker-action@v4

    - name: Run Flujo Base DIOT
      run: sbt "testOnly sat.diot.flujobase.Flujobasetest *Flujo Base"
    # - name: Run ScalaTest
    #  run: sbt "testOnly sat.diot.general.GeneralTest Execute SQL query"

    # - name: Run ScalaTest Logger
    #  run: sbt "testOnly sat.diot.Logger.TestLogger Logg Error"
      
