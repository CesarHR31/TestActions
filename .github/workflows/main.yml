name: Scala CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up sbt
      uses: sbt/setup-sbt@v1

    - name: Clean with sbt
      run: sbt clean

    - name: Compile with sbt
      run: sbt compile

    - name: Run ScalaTest
      run: sbt "testOnly sat.diot.general.GeneralTest Execute SQL query"
