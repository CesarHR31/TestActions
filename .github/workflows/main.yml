name: Scala CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Spark
      run: |
        wget https://downloads.apache.org/spark/spark-3.4.1/spark-3.4.1-bin-hadoop3.tgz
        tar -xzf spark-3.4.1-bin-hadoop3.tgz
        echo "SPARK_HOME=$(pwd)/spark-3.4.1-bin-hadoop3" >> $GITHUB_ENV

    - name: Set up sbt
      uses: sbt/setup-sbt@v1

    - name: Install docker
      uses: docker/setup-docker-action@v4
      
    - name: Run Docker
      run: |
        sudo systemctl start docker
        sudo systemctl enable docker

    - name: Run Flujo Base DIOT
      run: sbt "testOnly sat.diot.flujobase.Flujobasetest *Flujo Base"
    # - name: Run ScalaTest
    #  run: sbt "testOnly sat.diot.general.GeneralTest Execute SQL query"

    # - name: Run ScalaTest Logger
    #  run: sbt "testOnly sat.diot.Logger.TestLogger Logg Error"
      
